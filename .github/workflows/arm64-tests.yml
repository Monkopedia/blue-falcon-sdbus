# SPIKE (#31, half B): `linuxArm64` is published as a peer of `linuxX64` and
# `jvm`, is compiled on every push, and is *executed nowhere*. Measured on
# `main` @ cf0557b: `:engine:build`'s task graph contains
# `compileTestKotlinLinuxArm64` but neither `linkDebugTestLinuxArm64` nor
# `linuxArm64Test`, so the arm64 test code is compiled to a klib and then
# neither linked nor run. `grep -ric arm .github/workflows/build.yml` returns
# 1, and that single hit is a step *name* ("Build engine (linuxX64 +
# linuxArm64)") — a label describing coverage, not coverage.
#
# Shape adapted from sdbus-kotlin's `.github/workflows/arm-build-test.yaml`
# (read from its origin/main; that repo was not modified): cross-link the
# native test binary on an x86 runner, hand it to a native `ubuntu-24.04-arm`
# runner as an artifact, and execute it there. No QEMU, no self-hosted
# machine, no new hardware.
#
# This file is the ENTIRETY of half B. It is deliberately a new workflow
# rather than extra jobs in `build.yml` so that half B can be taken or dropped
# by adding or deleting one file.
name: linuxArm64 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cross-link-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # `engine/build.gradle.kts:27-35` already passes
      # `-L/usr/lib/aarch64-linux-gnu -lsystemd` for linuxArm64 — that block
      # has simply never been exercised, because no arm64 binary is ever
      # linked. `/usr/lib/aarch64-linux-gnu` is exactly where the multiarch
      # arm64 package lands, so enabling the arm64 architecture here is
      # enough: no change to any Gradle file is required.
      #
      # (sdbus-kotlin instead vendors a full aarch64 libsystemd tree under
      # `libs/aarch64/` plus a `-Xoverride-konan-properties` linker override.
      # We try the cheaper route first precisely because the alternative would
      # mean editing `engine/build.gradle.kts`, the tier-3 published module.)
      - name: Enable arm64 packages and install cross libsystemd
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture arm64
          # ubuntu-24.04 uses deb822 sources; pin the existing (amd64-only)
          # archive so `apt update` does not try to fetch arm64 from it.
          sudo sed -i '/^Types: deb$/a Architectures: amd64' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            libsystemd-dev \
            libsystemd-dev:arm64 \
            binutils-aarch64-linux-gnu
          # Positive control: fail loudly here rather than inside the linker.
          test -e /usr/lib/aarch64-linux-gnu/libsystemd.so
          ls -l /usr/lib/aarch64-linux-gnu/libsystemd.so*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Link engine linuxArm64 test binary
        run: ./gradlew :engine:linkDebugTestLinuxArm64

      # Not part of the "execute arm64" goal, but the same gap one module
      # over: `integration-tests/build.gradle.kts:20-28` declares a linuxArm64
      # target that nothing ever compiles, so harness code could stop building
      # for arm64 silently. Link only — running it needs a physical BF-Test
      # peripheral.
      - name: Link integration-tests linuxArm64 test binary
        run: ./gradlew :integration-tests:linkDebugTestLinuxArm64

      - name: Upload linuxArm64 test binary
        uses: actions/upload-artifact@v4
        with:
          name: engine-linuxarm64-test-${{ github.run_id }}
          retention-days: 7
          path: engine/build/bin/linuxArm64/debugTest/test.kexe

  run-arm64:
    needs: cross-link-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Download linuxArm64 test binary
        uses: actions/download-artifact@v4
        with:
          name: engine-linuxarm64-test-${{ github.run_id }}
          path: arm64-test

      # This is the step that did not exist anywhere in this repo: the first
      # time any linuxArm64 code from this project is executed.
      - name: Run engine linuxArm64 unit tests
        run: |
          set -euxo pipefail
          BIN="$(find arm64-test -type f -name 'test.kexe' | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "::error::linuxArm64 test binary missing after artifact download"
            find arm64-test -maxdepth 4 | sort
            exit 1
          fi
          chmod +x "$BIN"
          file "$BIN"

          # Run it, but do NOT treat exit 0 as the assertion. A test binary
          # built with no tests exits 0 and reports "0 tests" — which is the
          # exact defect this workflow exists to catch, so relying on the
          # exit code alone would reproduce it here.
          "$BIN" | tee arm64-test-output.txt

          # PIPESTATUS, not $?: the pipe above makes $? tee's status.
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::linuxArm64 tests failed"
            exit 1
          fi

          # Kotlin/Native prints: "[==========] N tests from M test cases ran."
          RAN="$(sed -n 's/.*\[==========\] \([0-9][0-9]*\) tests\? from .*/\1/p' \
                 arm64-test-output.txt | tail -n 1)"
          if [ -z "$RAN" ]; then
            echo "::error::no test-summary line found — the binary ran but reported nothing"
            exit 1
          fi
          if [ "$RAN" -lt 1 ]; then
            echo "::error::linuxArm64 binary executed $RAN tests; a green run here would measure nothing"
            exit 1
          fi
          echo "linuxArm64 executed $RAN tests"
